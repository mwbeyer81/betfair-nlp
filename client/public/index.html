<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      iOS Safari deliberately ignores maximum-scale=1 / user-scalable=no in the
      viewport meta tag (a WebKit accessibility override, since iOS 10) — so
      pinch/double-tap zoom can still happen despite these. The touch-action:
      pan-y rule below is what actually blocks it: unlike the viewport meta,
      touch-action IS honored by iOS, and restricting gestures to vertical pan
      only prevents pinch-zoom and horizontal drag while still allowing the
      app's own vertical scroll views to work. position:fixed html/body locks
      out whole-page pan/bounce-scroll (iOS Safari can bounce-scroll the page
      even with overflow:hidden on body alone).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4338CA" />
    <title>client</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Lock the page frame so only the app's own scroll views can scroll —
         iOS Safari can pan/bounce the whole document even with overflow:hidden
         unless html/body are also taken out of the normal flow with position:fixed. */
      html,
      body {
        position: fixed;
        inset: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-y;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        touch-action: pan-y;
      }
    </style>
  </head>
  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
